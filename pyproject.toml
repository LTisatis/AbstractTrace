[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "abstract-trace"
version = "0.1.0"
description = "Evidence-linked review of research paper abstracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28.2,<2",
    "openai>=2.20,<3",
    "httpx[socks]>=0.28,<1",
    "pydantic>=2.10,<3",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.22,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=5,<6"]

[project.scripts]
abstract-review = "abstract_review.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/abstract_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires an explicitly configured external service"]
